# Dataset1 formal experiment:
# - Same 5 shared Taihu features mapped to *_avg columns
# - Same 3 aligned DBP targets
# - Same 4 model families for direct horizontal comparison
# - Formal tuning narrows each search space around the scout hot spots
# - drop_missing enforces complete-case rows before fitting
#
# Scout reference:
#   checkpoints/scout_dataset1_5feat_avg/20260330T232412Z
#
# Key scout findings:
#   - RF was the strongest macro model and the best TTHM baseline.
#   - MLP won DBCM and BDCM, so the formal search stays centered on compact
#     medium-width networks with low dropout.
#   - XGB remained competitive enough for direct comparison, but not dominant.
#   - KAN lagged on two of three targets, so it stays in a compact, low-cost
#     regime for comparability instead of a wide exploratory search.
#
# Run:
#   dbp run experiments/formal_dataset1_5feat_avg.yaml --print-plan

dataset:
  path: ../data/dataset1_dbp_formation_with_split.csv
  format: csv
  features:
    - ph_in_avg
    - uv_in_avg
    - temp_in_avg
    - toc_in_avg
    - br_in_avg
  targets:
    - thm4_in_avg
    - dbcm_in_avg
    - bdcm_in_avg
  split:
    strategy: predefined
    column: split
    train_label: train
    test_label: test

task:
  strategy: per_target

features:
  steps:
    - name: drop_missing

models:
  # Scout hot spot:
  # - thm4: depth=12 + max_features=0.7 + min_leaf=2
  # - dbcm/bdcm: log2 + deeper trees or no max_depth cap
  # - bootstrap=false was preferred in the top trials
  - name: random_forest
    alias: rf
    params:
      n_estimators: 400
      max_depth: 12
      min_samples_split: 3
      min_samples_leaf: 1
      max_features: log2
      bootstrap: false
    tuning:
      trials: 60
    search_space:
      model:
        n_estimators:
          type: int
          low: 300
          high: 500
          step: 50
        max_depth:
          type: categorical
          choices: [null, 8, 12, 16]
        min_samples_split:
          type: int
          low: 2
          high: 6
        min_samples_leaf:
          type: int
          low: 1
          high: 3
        max_features:
          type: categorical
          choices: [0.7, sqrt, log2]
        bootstrap:
          type: categorical
          choices: [false, true]
        max_samples:
          type: float
          low: 0.8
          high: 1.0
          step: 0.1
          when:
            bootstrap: true
          default: null
      study:
        n_startup_trials: 12
        n_warmup_steps: 1

  # Scout hot spot:
  # - thm4/bdcm favored depth≈5, lr≈0.09-0.23, colsample≈0.9
  # - dbcm preferred shallower trees, more estimators, and lighter L2
  - name: xgboost
    alias: xgb
    params:
      n_estimators: 400
      max_depth: 5
      learning_rate: 0.09
      min_child_weight: 7.0
      subsample: 0.8
      colsample_bytree: 0.8
      reg_alpha: 0.0001
      reg_lambda: 0.1
      gamma: 0.0001
      early_stopping_rounds: 40
      tree_method: hist
    tuning:
      trials: 60
    search_space:
      model:
        n_estimators:
          type: int
          low: 300
          high: 550
          step: 50
        max_depth:
          type: int
          low: 3
          high: 6
        learning_rate:
          type: float
          low: 0.05
          high: 0.25
          log: true
        min_child_weight:
          type: float
          low: 5.0
          high: 10.0
        subsample:
          type: float
          low: 0.7
          high: 1.0
          step: 0.1
        colsample_bytree:
          type: categorical
          choices: [0.6, 0.7, 0.8, 0.9]
        gamma:
          type: float
          low: 0.00000001
          high: 0.05
          log: true
        reg_alpha:
          type: float
          low: 0.00000001
          high: 0.01
          log: true
        reg_lambda:
          type: float
          low: 0.001
          high: 3.0
          log: true
        early_stopping_rounds:
          type: categorical
          choices: [20, 30, 40, 50]
      study:
        n_startup_trials: 15
        n_warmup_steps: 1

  # Scout hot spot:
  # - thm4: [48,48] + ReLU + lr≈0.0086
  # - dbcm: [48,48,48] + LeakyReLU + low wd
  # - bdcm: [64,64] + LeakyReLU + batch_size=8
  - name: mlp
    alias: mlp
    params:
      hidden_dims: [48, 48]
      dropout: 0.1
      activation: LeakyReLU
    tuning:
      trials: 70
    search_space:
      model:
        hidden_dims:
          type: categorical
          choices: ["32-16", "32-32", "48-48", "64-64", "48-48-48", "64-64-64"]
          value_map:
            "32-16": [32, 16]
            "32-32": [32, 32]
            "48-48": [48, 48]
            "64-64": [64, 64]
            "48-48-48": [48, 48, 48]
            "64-64-64": [64, 64, 64]
        dropout:
          type: float
          low: 0.05
          high: 0.2
          step: 0.05
        activation:
          type: categorical
          choices: [ReLU, LeakyReLU, SiLU]
      training:
        lr:
          type: float
          low: 0.004
          high: 0.02
          log: true
        weight_decay:
          type: categorical
          choices: [0.000001, 0.00001, 0.0001, 0.001, 0.005]
        batch_size:
          type: categorical
          choices: [8, 16, 32]
        optimizer:
          type: categorical
          choices: [Adam, AdamW]
        loss:
          type: categorical
          choices: [MSE, Huber]
        huber_delta:
          type: categorical
          choices: [1.0, 2.0, 4.0]
      study:
        n_startup_trials: 18
        n_warmup_steps: 2

  # Scout hot spot:
  # - thm4 preferred grid=5, k=5
  # - dbcm/bdcm preferred grid=8 with [32,16]
  # - AdamW dominated the top trials across all three targets
  - name: kan
    alias: kan
    params:
      hidden_dims: [32, 16]
      grid: 8
      k: 3
      base_fun: silu
    tuning:
      trials: 40
    search_space:
      model:
        hidden_dims:
          type: categorical
          choices: ["24-12", "32", "32-16"]
          value_map:
            "24-12": [24, 12]
            "32": [32]
            "32-16": [32, 16]
        grid:
          type: categorical
          choices: [5, 8]
        k:
          type: categorical
          choices: [3, 5]
      training:
        lr:
          type: float
          low: 0.0008
          high: 0.006
          log: true
        weight_decay:
          type: float
          low: 0.00001
          high: 0.005
          log: true
        batch_size:
          type: categorical
          choices: [8, 16, 32]
        optimizer:
          type: categorical
          choices: [AdamW]
      study:
        n_startup_trials: 12
        n_warmup_steps: 2

training:
  seed: 42
  max_epochs: 1200
  patience: 100
  batch_size: 16
  lr: 0.001
  weight_decay: 0.0001
  val_fraction: 0.15
  optimizer: Adam
  loss: MSE

tuning:
  enabled: true
  scout: false
  folds: 5
  stability_penalty: 0.18

outputs:
  dir: ../checkpoints/formal_dataset1_5feat_avg
  save_models: true
  save_predictions: true
