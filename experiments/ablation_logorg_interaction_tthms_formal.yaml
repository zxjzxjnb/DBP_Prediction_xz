# Ablation Formal Tuning: pH + UV254 + Temp + log(TOC) + log(COD) + NO3-N + Temp×TOC
#
# Refined from the scout run:
#   checkpoints/ablation_logorg_interaction_tthms/20260321T000620Z
#
# Key scout findings:
#   - RF: max_features=0.5, bootstrap=true, max_depth=null, min_samples_split=8,
#         min_samples_leaf=3, max_samples=1.0
#   - XGB: max_depth=3, learning_rate≈0.156, colsample_bytree=0.8, subsample=0.8,
#          min_child_weight≈6.2
#   - MLP: [32]+SiLU, dropout=0.2, lr≈0.016, weight_decay=0.001, batch=8, Huber
#   - KAN: [24,12]+AdamW, lr≈0.01, weight_decay≈0.0048, batch=8
#
# Run:
#   dbp run experiments/ablation_logorg_interaction_tthms_formal.yaml

dataset:
  path: ../data/DBP_dataset_DWTP_B.csv
  format: csv
  features:
    - pH
    - UV254_A_cm
    - temp_C
    - TOC_mg_L
    - COD_mg_L
    - NO3_N_mg_L
  targets:
    - T_THMs_ug_L
  split:
    strategy: predefined
    column: split
    train_label: train
    test_label: test

task:
  strategy: per_target
  targets:
    - T_THMs_ug_L

features:
  steps:
    - name: interaction
      params:
        pairs:
          - [temp_C, TOC_mg_L]
    - name: log
      params:
        columns:
          - TOC_mg_L
          - COD_mg_L
    - name: select_columns
      params:
        columns:
          - pH
          - UV254_A_cm
          - temp_C
          - TOC_mg_L
          - COD_mg_L
          - NO3_N_mg_L
          - temp_C__x__TOC_mg_L

models:
  # RF was the scout winner and gets the tightest formal sweep.
  - name: random_forest
    alias: rf
    params:
      n_estimators: 400
      max_depth: null
      min_samples_split: 8
      min_samples_leaf: 3
      max_features: 0.5
      bootstrap: true
      max_samples: 1.0
    tuning:
      trials: 45
    search_space:
      model:
        n_estimators:
          type: categorical
          choices: [300, 350, 400, 450]
        max_depth:
          type: categorical
          choices: [null, 4, 6]
        min_samples_split:
          type: categorical
          choices: [6, 8, 10]
        min_samples_leaf:
          type: categorical
          choices: [2, 3, 4]
        max_features:
          type: categorical
          choices: [0.5, 0.6, sqrt, log2]
        bootstrap:
          type: categorical
          choices: [true]
        max_samples:
          type: categorical
          choices: [0.8, 0.9, 1.0]
          when:
            bootstrap: true
      study:
        n_startup_trials: 10
        n_warmup_steps: 1

  # XGB was the clearest runner-up, with a narrow optimum around depth=3 and
  # moderately strong column/row sampling.
  - name: xgboost
    alias: xgb
    params:
      n_estimators: 300
      max_depth: 3
      learning_rate: 0.12
      min_child_weight: 6.5
      subsample: 0.8
      colsample_bytree: 0.8
      reg_alpha: 0.001
      reg_lambda: 0.5
      gamma: 0.01
      early_stopping_rounds: 30
      tree_method: hist
    tuning:
      trials: 55
    search_space:
      model:
        n_estimators:
          type: categorical
          choices: [250, 300, 350]
        max_depth:
          type: categorical
          choices: [2, 3, 4]
        learning_rate:
          type: float
          low: 0.08
          high: 0.18
          log: true
        min_child_weight:
          type: categorical
          choices: [5.5, 6.0, 6.5, 7.0, 8.0]
        subsample:
          type: categorical
          choices: [0.7, 0.8, 0.9]
        colsample_bytree:
          type: categorical
          choices: [0.8, 0.9, 1.0]
        gamma:
          type: categorical
          choices: [0.001, 0.005, 0.01, 0.02, 0.05]
        reg_alpha:
          type: categorical
          choices: [0.0001, 0.001, 0.01]
        reg_lambda:
          type: categorical
          choices: [0.1, 0.5, 1.0, 2.0]
        early_stopping_rounds:
          type: categorical
          choices: [20, 30, 40]
      study:
        n_startup_trials: 12
        n_warmup_steps: 1

  # MLP was competitive but not best; keep a compact search centered on the scout hot spot.
  - name: mlp
    alias: mlp
    params:
      hidden_dims: [32]
      dropout: 0.2
      activation: SiLU
    tuning:
      trials: 40
    search_space:
      model:
        hidden_dims:
          type: categorical
          choices: ["32", "32-16", "16", "32-32"]
          value_map:
            "32": [32]
            "32-16": [32, 16]
            "16": [16]
            "32-32": [32, 32]
        dropout:
          type: categorical
          choices: [0.1, 0.15, 0.2, 0.25, 0.3]
        activation:
          type: categorical
          choices: [SiLU, LeakyReLU, Tanh]
      training:
        lr:
          type: categorical
          choices: [0.008, 0.01, 0.012, 0.016, 0.02]
        weight_decay:
          type: categorical
          choices: [0.000001, 0.00001, 0.0001, 0.001, 0.01]
        batch_size:
          type: categorical
          choices: [8, 16]
        optimizer: null
        loss:
          type: categorical
          choices: [MSE, Huber]
        huber_delta:
          type: categorical
          choices: [1.0]
      study:
        n_startup_trials: 12
        n_warmup_steps: 2

  # KAN stays in the same compact regime; scout suggested [24,12] with AdamW.
  - name: kan
    alias: kan
    params:
      hidden_dims: [24, 12]
      grid: 3
      k: 5
      base_fun: silu
    tuning:
      trials: 35
    search_space:
      model:
        hidden_dims:
          type: categorical
          choices: ["16", "24-12", "32", "32-16"]
          value_map:
            "16": [16]
            "24-12": [24, 12]
            "32": [32]
            "32-16": [32, 16]
        grid: null
        k: null
      training:
        lr:
          type: categorical
          choices: [0.006, 0.008, 0.01, 0.012]
        weight_decay:
          type: categorical
          choices: [0.000001, 0.00001, 0.0001, 0.001, 0.005]
        batch_size:
          type: categorical
          choices: [8, 16]
        optimizer:
          type: categorical
          choices: [Adam, AdamW]
      study:
        n_startup_trials: 10
        n_warmup_steps: 2

training:
  seed: 42
  max_epochs: 1200
  patience: 100
  batch_size: 16
  lr: 0.001
  weight_decay: 0.0001
  val_fraction: 0.15
  optimizer: Adam
  loss: MSE

tuning:
  enabled: true
  scout: false
  folds: 5
  stability_penalty: 0.18

outputs:
  dir: ../checkpoints/ablation_logorg_interaction_tthms_formal
  save_models: true
  save_predictions: true
