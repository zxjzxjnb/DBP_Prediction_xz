# Ablation Formal Tuning Round 2: pH + UV254 + Temperature + TOC (4 features)
#
# Refined from the 4-feature scout run:
#   checkpoints/ablation_4feat/20260315T221614Z
#
# Key scout findings:
#   - RF: T_THMs→sqrt+max_depth=4; DBCM/BDCM→log2+max_depth=4-8; bootstrap=true
#   - XGB: colsample_bytree=1.0 still dominant; max_depth=2-5; DBCM→high reg_lambda
#   - MLP: T_THMs→[16]+Tanh+wd=1e-5; DBCM→[32,32,32]+LeakyReLU/SiLU+Huber;
#          BDCM→[32,32,32]+Tanh+wd=0.02+Huber
#   - KAN: T_THMs→[16,8]+AdamW; DBCM→[16,8]+Adam; BDCM→[24,12]+AdamW
#
# Run:
#   dbp run experiments/ablation_4feat_formal.yaml

dataset:
  path: ../data/DBP_dataset_DWTP_B.csv
  format: csv
  features:
    - pH
    - UV254_A_cm
    - temp_C
    - TOC_mg_L
  targets:
    - T_THMs_ug_L
    - DBCM_ug_L
    - BDCM_ug_L
  split:
    strategy: predefined
    column: split
    train_label: train
    test_label: test

task:
  strategy: per_target

features:
  steps: []

models:
  # Scout: bootstrap=true unanimous; max_depth=4-8; max_features→sqrt/log2 now preferred.
  - name: random_forest
    alias: rf
    params:
      n_estimators: 350
      max_depth: 4
      min_samples_split: 8
      min_samples_leaf: 2
      max_features: sqrt
      bootstrap: true
      max_samples: 0.8
    tuning:
      trials: 50
    search_space:
      model:
        n_estimators:
          type: int
          low: 250
          high: 450
          step: 50
        max_depth:
          type: categorical
          choices: [null, 4, 6, 8]
        min_samples_split:
          type: int
          low: 2
          high: 10
        min_samples_leaf:
          type: int
          low: 1
          high: 4
        max_features:
          type: categorical
          choices: [0.7, sqrt, log2]
        bootstrap:
          type: categorical
          choices: [true, false]
        max_samples:
          type: float
          low: 0.7
          high: 1.0
          step: 0.1
          when:
            bootstrap: true
          default: null
      study:
        n_startup_trials: 12
        n_warmup_steps: 1

  # Scout: colsample_bytree=1.0; max_depth=2-5; DBCM→high reg_lambda (~8-10).
  - name: xgboost
    alias: xgb
    params:
      n_estimators: 400
      max_depth: 3
      learning_rate: 0.12
      min_child_weight: 7.5
      subsample: 0.8
      colsample_bytree: 1.0
      reg_alpha: 0.001
      reg_lambda: 1.0
      gamma: 0.01
      early_stopping_rounds: 40
      tree_method: hist
    tuning:
      trials: 70
    search_space:
      model:
        n_estimators:
          type: int
          low: 300
          high: 500
          step: 50
        max_depth:
          type: int
          low: 2
          high: 6
        learning_rate:
          type: float
          low: 0.04
          high: 0.25
          log: true
        min_child_weight:
          type: float
          low: 5.0
          high: 10.0
        subsample:
          type: float
          low: 0.6
          high: 1.0
          step: 0.1
        colsample_bytree:
          type: categorical
          choices: [0.9, 1.0]
        gamma:
          type: float
          low: 0.00001
          high: 0.3
          log: true
        reg_alpha:
          type: float
          low: 0.00000001
          high: 0.3
          log: true
        reg_lambda:
          type: float
          low: 0.001
          high: 10.0
          log: true
        early_stopping_rounds:
          type: categorical
          choices: [20, 30, 40]
      study:
        n_startup_trials: 15
        n_warmup_steps: 1

  # Scout: T_THMs→[16]+Tanh; DBCM→[32,32,32]+LeakyReLU+Huber;
  # BDCM→[32,32,32]+Tanh+wd=0.02+Huber. Strong per-target differences persist.
  - name: mlp
    alias: mlp
    params:
      hidden_dims: [32]
      dropout: 0.35
      activation: Tanh
    tuning:
      trials: 60
    search_space:
      model:
        hidden_dims:
          type: categorical
          choices: ["16", "32", "32-16", "32-32", "32-32-32"]
          value_map:
            "16": [16]
            "32": [32]
            "32-16": [32, 16]
            "32-32": [32, 32]
            "32-32-32": [32, 32, 32]
        dropout:
          type: float
          low: 0.2
          high: 0.5
          step: 0.05
        activation:
          type: categorical
          choices: [SiLU, LeakyReLU, Tanh]
      training:
        lr:
          type: float
          low: 0.005
          high: 0.02
          log: true
        weight_decay:
          type: categorical
          choices: [0.000001, 0.00001, 0.0001, 0.001, 0.01, 0.02, 0.05]
        batch_size:
          type: categorical
          choices: [8, 16, 32]
        optimizer: null
        loss:
          type: categorical
          choices: [MSE, Huber]
        huber_delta:
          type: categorical
          choices: [0.5, 1.0]
      study:
        n_startup_trials: 15
        n_warmup_steps: 2

  # grid=3, k=5 fixed. T_THMs→[16,8]; DBCM→[16,8]; BDCM→[24,12].
  - name: kan
    alias: kan
    params:
      hidden_dims: [16, 8]
      grid: 3
      k: 5
      base_fun: silu
    tuning:
      trials: 50
    search_space:
      model:
        hidden_dims:
          type: categorical
          choices: ["16", "16-8", "24-12"]
          value_map:
            "16": [16]
            "16-8": [16, 8]
            "24-12": [24, 12]
        grid: null
        k: null
      training:
        lr:
          type: float
          low: 0.002
          high: 0.01
          log: true
        weight_decay:
          type: float
          low: 0.0000001
          high: 0.005
          log: true
        batch_size:
          type: categorical
          choices: [8, 16, 32]
        optimizer:
          type: categorical
          choices: [Adam, AdamW]
      study:
        n_startup_trials: 12
        n_warmup_steps: 2

training:
  seed: 42
  max_epochs: 1200
  patience: 100
  batch_size: 16
  lr: 0.001
  weight_decay: 0.0001
  val_fraction: 0.15
  optimizer: Adam
  loss: MSE

tuning:
  enabled: true
  scout: false
  folds: 5
  stability_penalty: 0.18

outputs:
  dir: ../checkpoints/ablation_4feat_formal
  save_models: true
  save_predictions: true
