# Ablation Scout: pH + Temp + SUVA + COD (DBCM only)
#
# Feature pipeline:
#   - start with pH, temp_C, UV254_A_cm, TOC_mg_L, COD_mg_L
#   - create SUVA as UV254_A_cm / TOC_mg_L
#   - keep only [pH, temp_C, COD_mg_L, UV254_A_cm__div__TOC_mg_L]
#
# Run:
#   dbp run experiments/ablation_suva_dbcm_scout.yaml

dataset:
  path: ../data/DBP_dataset_DWTP_B.csv
  format: csv
  features:
    - pH
    - temp_C
    - UV254_A_cm
    - TOC_mg_L
    - COD_mg_L
  targets:
    - DBCM_ug_L
  split:
    strategy: predefined
    column: split
    train_label: train
    test_label: test

task:
  strategy: per_target
  targets:
    - DBCM_ug_L

features:
  steps:
    - name: ratio
      params:
        pairs:
          - left: UV254_A_cm
            right: TOC_mg_L
            name: UV254_A_cm__div__TOC_mg_L
    - name: select_columns
      params:
        columns:
          - pH
          - temp_C
          - COD_mg_L
          - UV254_A_cm__div__TOC_mg_L

models:
  # DBCM is often captured well by shallow-to-medium forests with bootstrap.
  - name: random_forest
    alias: rf
    params:
      n_estimators: 400
      max_depth: null
      min_samples_split: 4
      min_samples_leaf: 2
      max_features: 0.7
      bootstrap: true
      max_samples: 0.8
    tuning:
      trials: 30
    search_space:
      model:
        n_estimators:
          type: int
          low: 250
          high: 500
          step: 50
        max_depth:
          type: categorical
          choices: [null, 4, 6, 8]
        min_samples_split:
          type: int
          low: 2
          high: 10
        min_samples_leaf:
          type: int
          low: 1
          high: 4
        max_features:
          type: categorical
          choices: [0.5, 0.6, 0.7, sqrt, log2]
        bootstrap:
          type: categorical
          choices: [true, false]
        max_samples:
          type: float
          low: 0.7
          high: 1.0
          step: 0.1
          when:
            bootstrap: true
          default: null
      study:
        n_startup_trials: 10
        n_warmup_steps: 1

  # DBCM tends to prefer stronger regularization and modest depth in XGB.
  - name: xgboost
    alias: xgb
    params:
      n_estimators: 350
      max_depth: 4
      learning_rate: 0.06
      min_child_weight: 8.0
      subsample: 0.7
      colsample_bytree: 0.9
      reg_alpha: 0.001
      reg_lambda: 1.0
      gamma: 0.01
      early_stopping_rounds: 40
      tree_method: hist
    tuning:
      trials: 40
    search_space:
      model:
        n_estimators:
          type: int
          low: 250
          high: 500
          step: 50
        max_depth:
          type: int
          low: 2
          high: 6
        learning_rate:
          type: float
          low: 0.03
          high: 0.2
          log: true
        min_child_weight:
          type: float
          low: 4.0
          high: 10.0
        subsample:
          type: float
          low: 0.6
          high: 1.0
          step: 0.1
        colsample_bytree:
          type: categorical
          choices: [0.7, 0.8, 0.9, 1.0]
        gamma:
          type: float
          low: 0.00001
          high: 0.3
          log: true
        reg_alpha:
          type: float
          low: 0.00000001
          high: 0.3
          log: true
        reg_lambda:
          type: float
          low: 0.001
          high: 10.0
          log: true
        early_stopping_rounds:
          type: categorical
          choices: [20, 30, 40]
      study:
        n_startup_trials: 12
        n_warmup_steps: 1

  # Compact MLPs are a good scout baseline for DBCM on small feature sets.
  - name: mlp
    alias: mlp
    params:
      hidden_dims: [32, 16]
      dropout: 0.25
      activation: LeakyReLU
    tuning:
      trials: 30
    search_space:
      model:
        hidden_dims:
          type: categorical
          choices: ["16", "32", "32-16", "64-32", "32-32"]
          value_map:
            "16": [16]
            "32": [32]
            "32-16": [32, 16]
            "64-32": [64, 32]
            "32-32": [32, 32]
        dropout:
          type: float
          low: 0.15
          high: 0.5
          step: 0.05
        activation:
          type: categorical
          choices: [SiLU, LeakyReLU, Tanh]
      training:
        lr:
          type: float
          low: 0.002
          high: 0.02
          log: true
        weight_decay:
          type: categorical
          choices: [0.000001, 0.00001, 0.0001, 0.001, 0.01, 0.02, 0.05]
        batch_size:
          type: categorical
          choices: [8, 16, 32]
        optimizer: null
        loss:
          type: categorical
          choices: [MSE, Huber]
        huber_delta:
          type: categorical
          choices: [0.5, 1.0]
      study:
        n_startup_trials: 12
        n_warmup_steps: 2

  # grid=3, k=5 are still the most stable KAN defaults here.
  - name: kan
    alias: kan
    params:
      hidden_dims: [24, 12]
      grid: 3
      k: 5
      base_fun: silu
    tuning:
      trials: 25
    search_space:
      model:
        hidden_dims:
          type: categorical
          choices: ["16", "24-12", "32", "32-16"]
          value_map:
            "16": [16]
            "24-12": [24, 12]
            "32": [32]
            "32-16": [32, 16]
        grid: null
        k: null
      training:
        lr:
          type: float
          low: 0.002
          high: 0.01
          log: true
        weight_decay:
          type: float
          low: 0.0000001
          high: 0.005
          log: true
        batch_size:
          type: categorical
          choices: [8, 16, 32]
        optimizer:
          type: categorical
          choices: [Adam, AdamW]
      study:
        n_startup_trials: 10
        n_warmup_steps: 2

training:
  seed: 42
  max_epochs: 500
  patience: 50
  batch_size: 16
  lr: 0.001
  weight_decay: 0.0001
  val_fraction: 0.15
  optimizer: Adam
  loss: MSE

tuning:
  enabled: true
  trials: 40
  folds: 3
  stability_penalty: 0.18
  scout: true

outputs:
  dir: ../checkpoints/ablation_suva_dbcm
  save_models: false
  save_predictions: false
