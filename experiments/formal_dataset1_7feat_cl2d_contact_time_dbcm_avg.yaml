# Dataset1 formal experiment for DBCM with Cl2 dose + contact time:
# - 7 shared Taihu features mapped to *_avg columns
# - Uses the 7-feature backbone: pH + UV254 + temperature + TOC + bromide
#   + Cl2 dose + contact time
# - Single aligned DBP target: DBCM only
# - Formal tuning narrows each search space around the 7-feature scout hot spots
# - drop_missing enforces complete-case rows before fitting
#
# Scout reference:
#   checkpoints/scout_dataset1_7feat_cl2d_contact_time_avg/20260331T210736Z
#
# Key scout findings for DBCM:
#   - XGBoost was the strongest 7-feature model and preferred shallow trees
#     with moderate-to-high learning rates and relatively light regularization.
#   - MLP was effectively tied with KAN in scout and remains a strong formal
#     candidate given the earlier 6-feature contact-time formal result.
#   - RF stayed usable, but lagged behind the boosted / neural models.
#   - KAN is retained as a compact comparator, not the primary bet.
#
# Run:
#   dbp run experiments/formal_dataset1_7feat_cl2d_contact_time_dbcm_avg.yaml

dataset:
  path: ../data/dataset1_dbp_formation_with_split.csv
  format: csv
  features:
    - ph_in_avg
    - uv_in_avg
    - temp_in_avg
    - toc_in_avg
    - br_in_avg
    - cl2d_in_avg
    - time_sds_avg
  targets:
    - dbcm_in_avg
  split:
    strategy: predefined
    column: split
    train_label: train
    test_label: test

task:
  strategy: per_target
  targets:
    - dbcm_in_avg

features:
  steps:
    - name: drop_missing

models:
  # RF stays as a narrower comparator around the best 7-feature scout region.
  - name: random_forest
    alias: rf
    params:
      n_estimators: 350
      max_depth: null
      min_samples_split: 2
      min_samples_leaf: 1
      max_features: 0.7
      bootstrap: false
    tuning:
      trials: 40
    search_space:
      model:
        n_estimators:
          type: int
          low: 250
          high: 500
          step: 50
        max_depth:
          type: categorical
          choices: [null, 6, 8, 10]
        min_samples_split:
          type: int
          low: 2
          high: 6
        min_samples_leaf:
          type: int
          low: 1
          high: 3
        max_features:
          type: categorical
          choices: [0.7, sqrt, log2]
        bootstrap:
          type: categorical
          choices: [false, true]
        max_samples:
          type: float
          low: 0.8
          high: 1.0
          step: 0.1
          when:
            bootstrap: true
          default: null
      study:
        n_startup_trials: 10
        n_warmup_steps: 1

  # XGB is the primary 7-feature DBCM candidate, so the formal search is
  # centered around the scout-winning shallow-tree regime.
  - name: xgboost
    alias: xgb
    params:
      n_estimators: 350
      max_depth: 4
      learning_rate: 0.08
      min_child_weight: 2.0
      subsample: 0.8
      colsample_bytree: 0.9
      reg_alpha: 0.0001
      reg_lambda: 1.0
      gamma: 0.0001
      early_stopping_rounds: 30
      tree_method: hist
    tuning:
      trials: 65
    search_space:
      model:
        n_estimators:
          type: int
          low: 250
          high: 500
          step: 50
        max_depth:
          type: int
          low: 3
          high: 5
        learning_rate:
          type: float
          low: 0.03
          high: 0.18
          log: true
        min_child_weight:
          type: float
          low: 1.0
          high: 6.0
        subsample:
          type: float
          low: 0.7
          high: 1.0
          step: 0.1
        colsample_bytree:
          type: categorical
          choices: [0.8, 0.9, 1.0]
        gamma:
          type: float
          low: 0.00000001
          high: 0.05
          log: true
        reg_alpha:
          type: float
          low: 0.00000001
          high: 0.05
          log: true
        reg_lambda:
          type: float
          low: 0.1
          high: 5.0
          log: true
        early_stopping_rounds:
          type: categorical
          choices: [20, 30, 40]
      study:
        n_startup_trials: 14
        n_warmup_steps: 1

  # MLP remains a strong contender because it transferred well on the prior
  # contact-time formal and was nearly tied with KAN in the 7-feature scout.
  - name: mlp
    alias: mlp
    params:
      hidden_dims: [48, 48]
      dropout: 0.05
      activation: ReLU
    tuning:
      trials: 60
    search_space:
      model:
        hidden_dims:
          type: categorical
          choices: ["32-16", "48-48", "48-48-48", "64-32", "64-64"]
          value_map:
            "32-16": [32, 16]
            "48-48": [48, 48]
            "48-48-48": [48, 48, 48]
            "64-32": [64, 32]
            "64-64": [64, 64]
        dropout:
          type: float
          low: 0.0
          high: 0.15
          step: 0.05
        activation:
          type: categorical
          choices: [ReLU, Tanh, LeakyReLU]
      training:
        lr:
          type: float
          low: 0.003
          high: 0.015
          log: true
        weight_decay:
          type: categorical
          choices: [0.000001, 0.00001, 0.0001, 0.001, 0.003]
        batch_size:
          type: categorical
          choices: [8, 16, 32]
        optimizer:
          type: categorical
          choices: [Adam, AdamW]
        loss:
          type: categorical
          choices: [MSE, Huber]
        huber_delta:
          type: categorical
          choices: [1.0, 2.0]
      study:
        n_startup_trials: 15
        n_warmup_steps: 2

  # KAN stays in the formal run as a compact comparator, but the window is
  # intentionally narrower than the XGB / MLP search.
  - name: kan
    alias: kan
    params:
      hidden_dims: [32]
      grid: 8
      k: 3
      base_fun: silu
    tuning:
      trials: 35
    search_space:
      model:
        hidden_dims:
          type: categorical
          choices: ["16-8", "24-12", "32", "32-16"]
          value_map:
            "16-8": [16, 8]
            "24-12": [24, 12]
            "32": [32]
            "32-16": [32, 16]
        grid:
          type: categorical
          choices: [6, 8]
        k:
          type: categorical
          choices: [3]
      training:
        lr:
          type: float
          low: 0.0008
          high: 0.004
          log: true
        weight_decay:
          type: float
          low: 0.0000001
          high: 0.0005
          log: true
        batch_size:
          type: categorical
          choices: [8, 16]
        optimizer:
          type: categorical
          choices: [Adam, AdamW]
      study:
        n_startup_trials: 10
        n_warmup_steps: 2

training:
  seed: 42
  max_epochs: 1200
  patience: 100
  batch_size: 16
  lr: 0.001
  weight_decay: 0.0001
  val_fraction: 0.15
  optimizer: Adam
  loss: MSE

tuning:
  enabled: true
  scout: false
  folds: 5
  stability_penalty: 0.18

outputs:
  dir: ../checkpoints/formal_dataset1_7feat_cl2d_contact_time_dbcm_avg
  save_models: true
  save_predictions: true
