# Ablation Formal Tuning: pH + Temp + SUVA + COD (DBCM only)
#
# Refined from the SUVA-only scout run:
#   checkpoints/ablation_suva_dbcm/20260321T000702Z
#
# Key scout findings:
#   - RF: bootstrap=true dominated; max_depth=None and max_features=sqrt were strongest
#   - XGB: max_depth=3 was dominant; colsample_bytree=1.0 with lr around 0.14-0.19
#   - MLP: clear hotspot at [64,32] + LeakyReLU + Huber + batch_size=8
#   - KAN: [16] + AdamW + batch_size=8 dominated; lr concentrated near 0.0098
#
# Run:
#   dbp run experiments/ablation_suva_dbcm_formal.yaml

dataset:
  path: ../data/DBP_dataset_DWTP_B.csv
  format: csv
  features:
    - pH
    - temp_C
    - UV254_A_cm
    - TOC_mg_L
    - COD_mg_L
  targets:
    - DBCM_ug_L
  split:
    strategy: predefined
    column: split
    train_label: train
    test_label: test

task:
  strategy: per_target
  targets:
    - DBCM_ug_L

features:
  steps:
    - name: ratio
      params:
        pairs:
          - left: UV254_A_cm
            right: TOC_mg_L
            name: UV254_A_cm__div__TOC_mg_L
    - name: select_columns
      params:
        columns:
          - pH
          - temp_C
          - COD_mg_L
          - UV254_A_cm__div__TOC_mg_L
    - name: log1p
      params:
        columns:
          - COD_mg_L
          - UV254_A_cm__div__TOC_mg_L

models:
  # Scout converged to bootstrap forests with no depth cap or a shallow cap of 6.
  - name: random_forest
    alias: rf
    params:
      n_estimators: 500
      max_depth: null
      min_samples_split: 9
      min_samples_leaf: 2
      max_features: sqrt
      bootstrap: true
      max_samples: 0.9
    tuning:
      trials: 40
    search_space:
      model:
        n_estimators:
          type: int
          low: 400
          high: 500
          step: 50
        max_depth:
          type: categorical
          choices: [null, 6]
        min_samples_split:
          type: int
          low: 8
          high: 10
        min_samples_leaf:
          type: int
          low: 2
          high: 3
        max_features:
          type: categorical
          choices: [0.5, sqrt, log2]
        bootstrap:
          type: categorical
          choices: [true]
        max_samples:
          type: float
          low: 0.9
          high: 1.0
          step: 0.1
          when:
            bootstrap: true
          default: null
      study:
        n_startup_trials: 10
        n_warmup_steps: 1

  # Scout pointed to depth=3 XGBs with relatively high learning rate and weak regularization.
  - name: xgboost
    alias: xgb
    params:
      n_estimators: 400
      max_depth: 3
      learning_rate: 0.16
      min_child_weight: 5.0
      subsample: 0.8
      colsample_bytree: 1.0
      reg_alpha: 0.00001
      reg_lambda: 0.1
      gamma: 0.01
      early_stopping_rounds: 30
      tree_method: hist
    tuning:
      trials: 45
    search_space:
      model:
        n_estimators:
          type: int
          low: 350
          high: 500
          step: 50
        max_depth:
          type: categorical
          choices: [3, 4]
        learning_rate:
          type: float
          low: 0.08
          high: 0.2
          log: true
        min_child_weight:
          type: float
          low: 4.0
          high: 6.5
        subsample:
          type: float
          low: 0.7
          high: 1.0
          step: 0.1
        colsample_bytree:
          type: categorical
          choices: [0.8, 0.9, 1.0]
        gamma:
          type: float
          low: 0.0001
          high: 0.3
          log: true
        reg_alpha:
          type: float
          low: 0.00000001
          high: 0.05
          log: true
        reg_lambda:
          type: float
          low: 0.001
          high: 1.0
          log: true
        early_stopping_rounds:
          type: categorical
          choices: [20, 30, 40]
      study:
        n_startup_trials: 12
        n_warmup_steps: 1

  # Scout strongly preferred 64-32 + LeakyReLU + Huber, but 32-16 stays as a backup.
  - name: mlp
    alias: mlp
    params:
      hidden_dims: [64, 32]
      dropout: 0.45
      activation: LeakyReLU
    tuning:
      trials: 40
    search_space:
      model:
        hidden_dims:
          type: categorical
          choices: ["32-16", "64-32"]
          value_map:
            "32-16": [32, 16]
            "64-32": [64, 32]
        dropout:
          type: float
          low: 0.4
          high: 0.5
          step: 0.05
        activation:
          type: categorical
          choices: [LeakyReLU]
      training:
        lr:
          type: float
          low: 0.002
          high: 0.005
          log: true
        weight_decay:
          type: categorical
          choices: [0.0001, 0.001, 0.005]
        batch_size:
          type: categorical
          choices: [8, 16]
        optimizer: null
        loss:
          type: categorical
          choices: [Huber]
        huber_delta:
          type: categorical
          choices: [1.0]
      study:
        n_startup_trials: 10
        n_warmup_steps: 2

  # Scout concentrated on the smallest KAN, trained with AdamW and batch_size=8.
  - name: kan
    alias: kan
    params:
      hidden_dims: [16]
      grid: 3
      k: 5
      base_fun: silu
    tuning:
      trials: 30
    search_space:
      model:
        hidden_dims:
          type: categorical
          choices: ["16", "16-8"]
          value_map:
            "16": [16]
            "16-8": [16, 8]
        grid: null
        k: null
      training:
        lr:
          type: float
          low: 0.008
          high: 0.01
          log: true
        weight_decay:
          type: float
          low: 0.0001
          high: 0.005
          log: true
        batch_size:
          type: categorical
          choices: [8]
        optimizer:
          type: categorical
          choices: [AdamW]
      study:
        n_startup_trials: 8
        n_warmup_steps: 2

training:
  seed: 42
  max_epochs: 500
  patience: 50
  batch_size: 16
  lr: 0.001
  weight_decay: 0.0001
  val_fraction: 0.15
  optimizer: Adam
  loss: MSE

tuning:
  enabled: true
  trials: 45
  folds: 5
  stability_penalty: 0.18
  scout: false

outputs:
  dir: ../checkpoints/ablation_suva_dbcm_formal
  save_models: true
  save_predictions: true
