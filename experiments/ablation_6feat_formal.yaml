# Ablation Formal Tuning Round 4: pH + UV254 + Temp + TOC + COD + Br (6 features)
#
# Refined from the 6-feature scout run:
#   checkpoints/ablation_6feat/20260316T003520Z
#
# Key scout findings:
#   - RF: T_THMs→max_features=0.5+max_depth=6; DBCM→sqrt+max_depth=null;
#         BDCM→0.7+max_depth=4. bootstrap=true mostly.
#   - XGB: colsample_bytree=0.9 unanimous; max_depth=2-5; subsample=0.6-0.8;
#          DBCM→high reg_lambda (~9+)
#   - MLP: T_THMs→[32,32/32,32,32]+LeakyReLU+wd=0.01-0.02+MSE+batch=16;
#          DBCM→[32]+SiLU+wd=0.0001+Huber; BDCM→[32]+Tanh+wd=0.0001+batch=8
#   - KAN: T_THMs→[24,12]+AdamW; DBCM→[16]+AdamW; BDCM→[16]+Adam
#
# Run:
#   dbp run experiments/ablation_6feat_formal.yaml

dataset:
  path: ../data/DBP_dataset_DWTP_B.csv
  format: csv
  features:
    - pH
    - UV254_A_cm
    - temp_C
    - TOC_mg_L
    - COD_mg_L
    - Br_mg_L
  targets:
    - T_THMs_ug_L
    - DBCM_ug_L
    - BDCM_ug_L
  split:
    strategy: predefined
    column: split
    train_label: train
    test_label: test

task:
  strategy: per_target

features:
  steps: []

models:
  # Scout: max_features=0.5 for T_THMs, sqrt/0.7 for others. bootstrap mostly true.
  - name: random_forest
    alias: rf
    params:
      n_estimators: 350
      max_depth: 6
      min_samples_split: 5
      min_samples_leaf: 2
      max_features: 0.6
      bootstrap: true
      max_samples: 0.8
    tuning:
      trials: 50
    search_space:
      model:
        n_estimators:
          type: int
          low: 250
          high: 450
          step: 50
        max_depth:
          type: categorical
          choices: [null, 4, 6, 8]
        min_samples_split:
          type: int
          low: 2
          high: 10
        min_samples_leaf:
          type: int
          low: 1
          high: 4
        max_features:
          type: categorical
          choices: [0.5, 0.6, 0.7, sqrt]
        bootstrap:
          type: categorical
          choices: [true, false]
        max_samples:
          type: float
          low: 0.7
          high: 1.0
          step: 0.1
          when:
            bootstrap: true
          default: null
      study:
        n_startup_trials: 12
        n_warmup_steps: 1

  # Scout: colsample_bytree=0.9 unanimous; subsample=0.6; max_depth=2-5.
  - name: xgboost
    alias: xgb
    params:
      n_estimators: 350
      max_depth: 3
      learning_rate: 0.08
      min_child_weight: 8.5
      subsample: 0.6
      colsample_bytree: 0.9
      reg_alpha: 0.001
      reg_lambda: 1.0
      gamma: 0.005
      early_stopping_rounds: 40
      tree_method: hist
    tuning:
      trials: 70
    search_space:
      model:
        n_estimators:
          type: int
          low: 250
          high: 500
          step: 50
        max_depth:
          type: int
          low: 2
          high: 6
        learning_rate:
          type: float
          low: 0.03
          high: 0.2
          log: true
        min_child_weight:
          type: float
          low: 5.0
          high: 10.0
        subsample:
          type: float
          low: 0.6
          high: 0.9
          step: 0.1
        colsample_bytree:
          type: categorical
          choices: [0.8, 0.9, 1.0]
        gamma:
          type: float
          low: 0.00001
          high: 0.3
          log: true
        reg_alpha:
          type: float
          low: 0.00000001
          high: 0.3
          log: true
        reg_lambda:
          type: float
          low: 0.001
          high: 10.0
          log: true
        early_stopping_rounds:
          type: categorical
          choices: [20, 30, 40]
      study:
        n_startup_trials: 15
        n_warmup_steps: 1

  # Scout: T_THMs→[32,32/32,32,32]+LeakyReLU; DBCM→[32]+SiLU+Huber;
  # BDCM→[32]+Tanh. Architectures diverge strongly per target.
  - name: mlp
    alias: mlp
    params:
      hidden_dims: [32]
      dropout: 0.25
      activation: LeakyReLU
    tuning:
      trials: 60
    search_space:
      model:
        hidden_dims:
          type: categorical
          choices: ["16", "32", "32-16", "32-32", "32-32-32"]
          value_map:
            "16": [16]
            "32": [32]
            "32-16": [32, 16]
            "32-32": [32, 32]
            "32-32-32": [32, 32, 32]
        dropout:
          type: float
          low: 0.15
          high: 0.45
          step: 0.05
        activation:
          type: categorical
          choices: [SiLU, LeakyReLU, Tanh]
      training:
        lr:
          type: float
          low: 0.005
          high: 0.02
          log: true
        weight_decay:
          type: categorical
          choices: [0.000001, 0.00001, 0.0001, 0.001, 0.01, 0.02, 0.05]
        batch_size:
          type: categorical
          choices: [8, 16]
        optimizer: null
        loss:
          type: categorical
          choices: [MSE, Huber]
        huber_delta:
          type: categorical
          choices: [0.5, 1.0]
      study:
        n_startup_trials: 15
        n_warmup_steps: 2

  # grid=3, k=5 fixed. T_THMs→[24,12]; DBCM→[16]; BDCM→[16].
  - name: kan
    alias: kan
    params:
      hidden_dims: [16]
      grid: 3
      k: 5
      base_fun: silu
    tuning:
      trials: 50
    search_space:
      model:
        hidden_dims:
          type: categorical
          choices: ["16", "16-8", "24-12"]
          value_map:
            "16": [16]
            "16-8": [16, 8]
            "24-12": [24, 12]
        grid: null
        k: null
      training:
        lr:
          type: float
          low: 0.002
          high: 0.01
          log: true
        weight_decay:
          type: float
          low: 0.0000001
          high: 0.005
          log: true
        batch_size:
          type: categorical
          choices: [8, 16, 32]
        optimizer:
          type: categorical
          choices: [Adam, AdamW]
      study:
        n_startup_trials: 12
        n_warmup_steps: 2

training:
  seed: 42
  max_epochs: 1200
  patience: 100
  batch_size: 16
  lr: 0.001
  weight_decay: 0.0001
  val_fraction: 0.15
  optimizer: Adam
  loss: MSE

tuning:
  enabled: true
  scout: false
  folds: 5
  stability_penalty: 0.18

outputs:
  dir: ../checkpoints/ablation_6feat_formal
  save_models: true
  save_predictions: true
