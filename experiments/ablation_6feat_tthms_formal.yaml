# Ablation Formal Tuning: pH + UV254 + Temp + TOC + COD + NO3-N (T_THMs only)
#
# Refined from the 6-feature formal / T_THMs scout patterns:
#   checkpoints/ablation_6feat_formal/20260316T004125Z
#   checkpoints/ablation_1feat_temperature_formal/20260319T140746Z
#
# Key T_THMs signals carried over:
#   - RF: shallow-to-medium trees with bootstrap=true and modest feature subsampling
#   - XGB: low depth, moderate subsampling, and colsample_bytree around 0.8-0.9
#   - MLP: compact 1-2 layer nets, LeakyReLU/Tanh, and moderate regularization
#   - KAN: grid=3 and k=5 remain stable; [24,12] and [32,16] are the main shapes
#
# Run:
#   dbp run experiments/ablation_6feat_tthms_formal.yaml

dataset:
  path: ../data/DBP_dataset_DWTP_B.csv
  format: csv
  features:
    - pH
    - UV254_A_cm
    - temp_C
    - TOC_mg_L
    - COD_mg_L
    - NO3_N_mg_L
  targets:
    - T_THMs_ug_L
  split:
    strategy: predefined
    column: split
    train_label: train
    test_label: test

task:
  strategy: per_target
  targets:
    - T_THMs_ug_L

features:
  steps: []

models:
  # T_THMs tends to prefer shallow forests with bootstrap enabled and limited
  # max_features, especially once NO3-N is added to the 5-feature backbone.
  - name: random_forest
    alias: rf
    params:
      n_estimators: 350
      max_depth: 6
      min_samples_split: 4
      min_samples_leaf: 2
      max_features: 0.6
      bootstrap: true
      max_samples: 0.8
    tuning:
      trials: 40
    search_space:
      model:
        n_estimators:
          type: int
          low: 250
          high: 450
          step: 50
        max_depth:
          type: categorical
          choices: [null, 4, 6, 8]
        min_samples_split:
          type: int
          low: 2
          high: 10
        min_samples_leaf:
          type: int
          low: 1
          high: 4
        max_features:
          type: categorical
          choices: [0.5, 0.6, 0.7, sqrt, log2]
        bootstrap:
          type: categorical
          choices: [true, false]
        max_samples:
          type: float
          low: 0.7
          high: 1.0
          step: 0.1
          when:
            bootstrap: true
          default: null
      study:
        n_startup_trials: 10
        n_warmup_steps: 1

  # T_THMs usually tolerates shallow XGB with moderate subsampling and
  # a slightly wider depth window than the temperature-only baseline.
  - name: xgboost
    alias: xgb
    params:
      n_estimators: 300
      max_depth: 3
      learning_rate: 0.08
      min_child_weight: 6.0
      subsample: 0.7
      colsample_bytree: 0.9
      reg_alpha: 0.001
      reg_lambda: 0.5
      gamma: 0.01
      early_stopping_rounds: 30
      tree_method: hist
    tuning:
      trials: 55
    search_space:
      model:
        n_estimators:
          type: int
          low: 200
          high: 450
          step: 50
        max_depth:
          type: int
          low: 2
          high: 5
        learning_rate:
          type: float
          low: 0.03
          high: 0.2
          log: true
        min_child_weight:
          type: float
          low: 4.0
          high: 9.0
        subsample:
          type: float
          low: 0.6
          high: 0.9
          step: 0.1
        colsample_bytree:
          type: categorical
          choices: [0.8, 0.9, 1.0]
        gamma:
          type: float
          low: 0.00001
          high: 0.3
          log: true
        reg_alpha:
          type: float
          low: 0.00000001
          high: 0.2
          log: true
        reg_lambda:
          type: float
          low: 0.001
          high: 5.0
          log: true
        early_stopping_rounds:
          type: categorical
          choices: [20, 30, 40]
      study:
        n_startup_trials: 12
        n_warmup_steps: 1

  # Compact feed-forward nets have been the best neural baseline for T_THMs.
  - name: mlp
    alias: mlp
    params:
      hidden_dims: [32]
      dropout: 0.25
      activation: LeakyReLU
    tuning:
      trials: 50
    search_space:
      model:
        hidden_dims:
          type: categorical
          choices: ["16", "32", "32-16", "32-32", "16-8"]
          value_map:
            "16": [16]
            "32": [32]
            "32-16": [32, 16]
            "32-32": [32, 32]
            "16-8": [16, 8]
        dropout:
          type: float
          low: 0.1
          high: 0.4
          step: 0.05
        activation:
          type: categorical
          choices: [SiLU, LeakyReLU, Tanh]
      training:
        lr:
          type: float
          low: 0.003
          high: 0.02
          log: true
        weight_decay:
          type: categorical
          choices: [0.000001, 0.00001, 0.0001, 0.001, 0.01, 0.02, 0.05]
        batch_size:
          type: categorical
          choices: [8, 16]
        optimizer: null
        loss:
          type: categorical
          choices: [MSE, Huber]
        huber_delta:
          type: categorical
          choices: [0.5, 1.0]
      study:
        n_startup_trials: 12
        n_warmup_steps: 2

  # grid=3, k=5 remain the most stable KAN settings on the ablation line.
  - name: kan
    alias: kan
    params:
      hidden_dims: [24, 12]
      grid: 3
      k: 5
      base_fun: silu
    tuning:
      trials: 40
    search_space:
      model:
        hidden_dims:
          type: categorical
          choices: ["16", "24-12", "32", "32-16"]
          value_map:
            "16": [16]
            "24-12": [24, 12]
            "32": [32]
            "32-16": [32, 16]
        grid: null
        k: null
      training:
        lr:
          type: float
          low: 0.002
          high: 0.01
          log: true
        weight_decay:
          type: float
          low: 0.0000001
          high: 0.005
          log: true
        batch_size:
          type: categorical
          choices: [8, 16, 32]
        optimizer:
          type: categorical
          choices: [Adam, AdamW]
      study:
        n_startup_trials: 10
        n_warmup_steps: 2

training:
  seed: 42
  max_epochs: 1200
  patience: 100
  batch_size: 16
  lr: 0.001
  weight_decay: 0.0001
  val_fraction: 0.15
  optimizer: Adam
  loss: MSE

tuning:
  enabled: true
  scout: false
  folds: 5
  stability_penalty: 0.18

outputs:
  dir: ../checkpoints/ablation_6feat_tthms_formal
  save_models: true
  save_predictions: true
