# Ablation Formal: pH + UV254 + Temp + TOC + COD + log(Br) + Br/TOC (BDCM only)
#
# Refined from the scout run:
#   checkpoints/ablation_logbr_ratio_bdcm/20260321T000620Z
#
# Key scout findings applied:
#   - RF: max_features=0.7, max_depth=8, bootstrap=true, min_samples_leaf=3
#   - XGB: max_depth=5, colsample_bytree=0.8, subsample=0.7, lr≈0.21, min_child_weight≈8
#   - MLP: [32,32]+LeakyReLU+Huber+wd=0.001, batch=8
#   - KAN: [24,12]+AdamW+lr≈0.01+wd≈1e-5
#
# Run:
#   dbp run experiments/ablation_logbr_ratio_bdcm_formal.yaml

dataset:
  path: ../data/DBP_dataset_DWTP_B.csv
  format: csv
  features:
    - pH
    - UV254_A_cm
    - temp_C
    - TOC_mg_L
    - COD_mg_L
    - Br_mg_L
  targets:
    - BDCM_ug_L
  split:
    strategy: predefined
    column: split
    train_label: train
    test_label: test

task:
  strategy: per_target
  targets:
    - BDCM_ug_L

features:
  steps:
    - name: ratio
      params:
        pairs:
          - [Br_mg_L, TOC_mg_L, Br_mg_L__div__TOC_mg_L]
    - name: log
      params:
        columns: [Br_mg_L]
    - name: select_columns
      params:
        columns:
          - pH
          - UV254_A_cm
          - temp_C
          - TOC_mg_L
          - COD_mg_L
          - Br_mg_L
          - Br_mg_L__div__TOC_mg_L

models:
  # Keep the forest centered on the scout sweet spot, but still allow a small
  # amount of exploration around max_depth and feature subsampling.
  - name: random_forest
    alias: rf
    params:
      n_estimators: 350
      max_depth: 8
      min_samples_split: 4
      min_samples_leaf: 3
      max_features: 0.7
      bootstrap: true
      max_samples: 0.8
    tuning:
      trials: 50
    search_space:
      model:
        n_estimators:
          type: int
          low: 250
          high: 500
          step: 50
        max_depth:
          type: categorical
          choices: [null, 6, 8, 10]
        min_samples_split:
          type: int
          low: 2
          high: 10
        min_samples_leaf:
          type: int
          low: 2
          high: 5
        max_features:
          type: categorical
          choices: [0.6, 0.7, sqrt, log2]
        bootstrap:
          type: categorical
          choices: [true]
        max_samples:
          type: float
          low: 0.8
          high: 1.0
          step: 0.1
          when:
            bootstrap: true
          default: null
      study:
        n_startup_trials: 12
        n_warmup_steps: 1

  # XGB was close, but the formal search is biased toward the scout hotspot
  # around depth-5 with stronger regularization and subsampling.
  - name: xgboost
    alias: xgb
    params:
      n_estimators: 400
      max_depth: 5
      learning_rate: 0.2
      min_child_weight: 8.0
      subsample: 0.7
      colsample_bytree: 0.8
      reg_alpha: 0.1
      reg_lambda: 0.8
      gamma: 0.01
      early_stopping_rounds: 20
      tree_method: hist
    tuning:
      trials: 60
    search_space:
      model:
        n_estimators:
          type: int
          low: 300
          high: 500
          step: 50
        max_depth:
          type: int
          low: 3
          high: 6
        learning_rate:
          type: float
          low: 0.08
          high: 0.25
          log: true
        min_child_weight:
          type: float
          low: 6.0
          high: 10.0
        subsample:
          type: float
          low: 0.6
          high: 0.8
          step: 0.1
        colsample_bytree:
          type: categorical
          choices: [0.7, 0.8, 0.9]
        gamma:
          type: float
          low: 0.00001
          high: 0.05
          log: true
        reg_alpha:
          type: float
          low: 0.000001
          high: 0.2
          log: true
        reg_lambda:
          type: float
          low: 0.1
          high: 3.0
          log: true
        early_stopping_rounds:
          type: categorical
          choices: [20, 30, 40]
      study:
        n_startup_trials: 15
        n_warmup_steps: 1

  # Small MLPs stayed competitive, especially when paired with Huber loss.
  - name: mlp
    alias: mlp
    params:
      hidden_dims: [32, 32]
      dropout: 0.25
      activation: LeakyReLU
    tuning:
      trials: 40
    search_space:
      model:
        hidden_dims:
          type: categorical
          choices: ["32-32", "32-16", "24-12", "16", "16-8"]
          value_map:
            "32-32": [32, 32]
            "32-16": [32, 16]
            "24-12": [24, 12]
            "16": [16]
            "16-8": [16, 8]
        dropout:
          type: float
          low: 0.15
          high: 0.4
          step: 0.05
        activation:
          type: categorical
          choices: [LeakyReLU, Tanh, SiLU]
      training:
        lr:
          type: float
          low: 0.005
          high: 0.02
          log: true
        weight_decay:
          type: categorical
          choices: [0.000001, 0.00001, 0.0001, 0.001, 0.01]
        batch_size:
          type: categorical
          choices: [8, 16, 32]
        optimizer: null
        loss:
          type: categorical
          choices: [MSE, Huber]
        huber_delta:
          type: categorical
          choices: [0.5, 1.0]
      study:
        n_startup_trials: 12
        n_warmup_steps: 2

  # KAN stays on the same fixed structural defaults, but formal narrows the
  # hidden-dim choices around the scout winner.
  - name: kan
    alias: kan
    params:
      hidden_dims: [24, 12]
      grid: 3
      k: 5
      base_fun: silu
    tuning:
      trials: 30
    search_space:
      model:
        hidden_dims:
          type: categorical
          choices: ["24-12", "32-16", "16", "32"]
          value_map:
            "24-12": [24, 12]
            "32-16": [32, 16]
            "16": [16]
            "32": [32]
        grid: null
        k: null
      training:
        lr:
          type: float
          low: 0.005
          high: 0.012
          log: true
        weight_decay:
          type: float
          low: 0.0000001
          high: 0.0001
          log: true
        batch_size:
          type: categorical
          choices: [8, 16, 32]
        optimizer:
          type: categorical
          choices: [Adam, AdamW]
      study:
        n_startup_trials: 10
        n_warmup_steps: 2

training:
  seed: 42
  max_epochs: 1200
  patience: 100
  batch_size: 16
  lr: 0.001
  weight_decay: 0.0001
  val_fraction: 0.15
  optimizer: Adam
  loss: MSE

tuning:
  enabled: true
  scout: false
  folds: 5
  stability_penalty: 0.18

outputs:
  dir: ../checkpoints/ablation_logbr_ratio_bdcm_formal
  save_models: true
  save_predictions: true
