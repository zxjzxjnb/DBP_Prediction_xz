# Dataset1 formal experiment for THM4:
# - 7 shared Taihu features mapped to *_avg columns
# - Uses the 5-feature backbone plus cl2d_in_avg and time_sds_avg
# - Single target: thm4_in_avg
# - Formal tuning narrows around the 7-feature scout hot spots
#
# Scout reference:
#   checkpoints/scout_dataset1_7feat_cl2d_contact_time_avg/20260331T210736Z
#
# Key scout signals for THM4:
#   - RF was the strongest model overall, with bootstrap=true and max_depth=16
#   - XGB preferred shallow trees with moderate sampling and low regularization
#   - MLP favored a compact 48-48 ReLU net with low dropout
#   - KAN stayed stable around grid=5, k=3, and [32,16]
#
# Run:
#   dbp run experiments/formal_dataset1_7feat_cl2d_contact_time_thm4_avg.yaml

dataset:
  path: ../data/dataset1_dbp_formation_with_split.csv
  format: csv
  features:
    - ph_in_avg
    - uv_in_avg
    - temp_in_avg
    - toc_in_avg
    - br_in_avg
    - cl2d_in_avg
    - time_sds_avg
  targets:
    - thm4_in_avg
  split:
    strategy: predefined
    column: split
    train_label: train
    test_label: test

task:
  strategy: per_target
  targets:
    - thm4_in_avg

features:
  steps:
    - name: drop_missing

models:
  # RF remained the clearest winner for THM4 in the 7-feature scout.
  - name: random_forest
    alias: rf
    params:
      n_estimators: 350
      max_depth: 16
      min_samples_split: 3
      min_samples_leaf: 1
      max_features: 0.7
      bootstrap: true
      max_samples: 1.0
    tuning:
      trials: 50
    search_space:
      model:
        n_estimators:
          type: int
          low: 300
          high: 450
          step: 50
        max_depth:
          type: categorical
          choices: [null, 12, 16]
        min_samples_split:
          type: int
          low: 2
          high: 5
        min_samples_leaf:
          type: int
          low: 1
          high: 2
        max_features:
          type: categorical
          choices: [0.6, 0.7, sqrt, log2]
        bootstrap:
          type: categorical
          choices: [true, false]
        max_samples:
          type: float
          low: 0.8
          high: 1.0
          step: 0.1
          when:
            bootstrap: true
          default: null
      study:
        n_startup_trials: 12
        n_warmup_steps: 1

  # THM4 XGB preferred shallow trees, sampling around 0.7-0.9, and mild regularization.
  - name: xgboost
    alias: xgb
    params:
      n_estimators: 250
      max_depth: 4
      learning_rate: 0.17
      min_child_weight: 3.0
      subsample: 0.7
      colsample_bytree: 0.9
      reg_alpha: 0.005
      reg_lambda: 0.12
      gamma: 0.00005
      early_stopping_rounds: 10
      tree_method: hist
    tuning:
      trials: 60
    search_space:
      model:
        n_estimators:
          type: int
          low: 150
          high: 400
          step: 50
        max_depth:
          type: int
          low: 3
          high: 5
        learning_rate:
          type: float
          low: 0.12
          high: 0.22
          log: true
        min_child_weight:
          type: float
          low: 2.0
          high: 5.0
        subsample:
          type: float
          low: 0.7
          high: 0.9
          step: 0.1
        colsample_bytree:
          type: categorical
          choices: [0.8, 0.9, 1.0]
        gamma:
          type: float
          low: 0.000001
          high: 0.001
          log: true
        reg_alpha:
          type: float
          low: 0.000001
          high: 0.05
          log: true
        reg_lambda:
          type: float
          low: 0.05
          high: 0.5
          log: true
        early_stopping_rounds:
          type: categorical
          choices: [10, 20, 30]
      study:
        n_startup_trials: 15
        n_warmup_steps: 1

  # Compact ReLU MLPs stayed competitive and were especially stable around 48-48.
  - name: mlp
    alias: mlp
    params:
      hidden_dims: [48, 48]
      dropout: 0.1
      activation: ReLU
    tuning:
      trials: 60
    search_space:
      model:
        hidden_dims:
          type: categorical
          choices: ["32-32", "48-32", "48-48", "64-48", "64-64"]
          value_map:
            "32-32": [32, 32]
            "48-32": [48, 32]
            "48-48": [48, 48]
            "64-48": [64, 48]
            "64-64": [64, 64]
        dropout:
          type: float
          low: 0.0
          high: 0.2
          step: 0.05
        activation:
          type: categorical
          choices: [ReLU, LeakyReLU, Tanh]
      training:
        lr:
          type: float
          low: 0.003
          high: 0.01
          log: true
        weight_decay:
          type: categorical
          choices: [0.000001, 0.00001, 0.0001, 0.001]
        batch_size:
          type: categorical
          choices: [8, 16, 32]
        optimizer:
          type: categorical
          choices: [Adam, AdamW]
        loss:
          type: categorical
          choices: [MSE, Huber]
        huber_delta:
          type: categorical
          choices: [1.0, 2.0]
      study:
        n_startup_trials: 15
        n_warmup_steps: 2

  # KAN stayed compact, with grid=5 / k=3 and [32,16] or [24,12] being the main shapes.
  - name: kan
    alias: kan
    params:
      hidden_dims: [32, 16]
      grid: 5
      k: 3
      base_fun: silu
    tuning:
      trials: 45
    search_space:
      model:
        hidden_dims:
          type: categorical
          choices: ["16-8", "24-12", "32", "32-16"]
          value_map:
            "16-8": [16, 8]
            "24-12": [24, 12]
            "32": [32]
            "32-16": [32, 16]
        grid:
          type: categorical
          choices: [3, 5]
        k:
          type: categorical
          choices: [3, 5]
      training:
        lr:
          type: float
          low: 0.003
          high: 0.008
          log: true
        weight_decay:
          type: float
          low: 0.000001
          high: 0.002
          log: true
        batch_size:
          type: categorical
          choices: [8, 16]
        optimizer:
          type: categorical
          choices: [Adam, AdamW]
      study:
        n_startup_trials: 12
        n_warmup_steps: 2

training:
  seed: 42
  max_epochs: 1200
  patience: 100
  batch_size: 16
  lr: 0.001
  weight_decay: 0.0001
  val_fraction: 0.15
  optimizer: Adam
  loss: MSE

tuning:
  enabled: true
  scout: false
  folds: 5
  stability_penalty: 0.18

outputs:
  dir: ../checkpoints/formal_dataset1_7feat_cl2d_contact_time_thm4_avg
  save_models: true
  save_predictions: true
