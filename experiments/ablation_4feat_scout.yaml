# Ablation Scout Round 2: pH + UV254 + Temperature + TOC (4 features)
#
# Builds on the 3-feature ablation findings. Adding TOC provides organic
# matter content which is a known DBP precursor indicator.
#
# Search spaces inherited from the 3-feature scout with minor adjustments
# for the additional feature dimension.
#
# Run:
#   dbp run experiments/ablation_4feat_scout.yaml

dataset:
  path: ../data/DBP_dataset_DWTP_B.csv
  format: csv
  features:
    - pH
    - UV254_A_cm
    - temp_C
    - TOC_mg_L
  targets:
    - T_THMs_ug_L
    - DBCM_ug_L
    - BDCM_ug_L
  split:
    strategy: predefined
    column: split
    train_label: train
    test_label: test

task:
  strategy: per_target

features:
  steps: []

models:
  # 3-feat formal: max_depth=4-6, max_features=0.7, bootstrap=true dominated.
  # With 4 features, max_features and max_depth ranges stay similar.
  - name: random_forest
    alias: rf
    params:
      n_estimators: 350
      max_depth: 6
      min_samples_split: 8
      min_samples_leaf: 4
      max_features: 0.7
      bootstrap: true
      max_samples: 0.8
    tuning:
      trials: 30
    search_space:
      model:
        n_estimators:
          type: int
          low: 250
          high: 450
          step: 50
        max_depth:
          type: categorical
          choices: [null, 4, 6, 8]
        min_samples_split:
          type: int
          low: 2
          high: 10
        min_samples_leaf:
          type: int
          low: 1
          high: 4
        max_features:
          type: categorical
          choices: [0.7, 1.0, sqrt, log2]
        bootstrap:
          type: categorical
          choices: [true, false]
        max_samples:
          type: float
          low: 0.7
          high: 1.0
          step: 0.1
          when:
            bootstrap: true
          default: null

  # 3-feat: colsample_bytree=1.0 dominated. With 4 features, allow slight sub-sampling.
  - name: xgboost
    alias: xgb
    params:
      n_estimators: 350
      max_depth: 3
      learning_rate: 0.15
      min_child_weight: 7.0
      subsample: 0.8
      colsample_bytree: 1.0
      reg_alpha: 0.001
      reg_lambda: 1.0
      gamma: 0.01
      early_stopping_rounds: 30
      tree_method: hist
    tuning:
      trials: 40
    search_space:
      model:
        n_estimators:
          type: int
          low: 250
          high: 500
          step: 50
        max_depth:
          type: int
          low: 2
          high: 6
        learning_rate:
          type: float
          low: 0.03
          high: 0.25
          log: true
        min_child_weight:
          type: float
          low: 3.0
          high: 10.0
        subsample:
          type: float
          low: 0.6
          high: 1.0
          step: 0.1
        colsample_bytree:
          type: categorical
          choices: [0.7, 0.8, 0.9, 1.0]
        gamma:
          type: float
          low: 0.00001
          high: 0.3
          log: true
        reg_alpha:
          type: float
          low: 0.00000001
          high: 0.3
          log: true
        reg_lambda:
          type: float
          low: 0.001
          high: 10.0
          log: true
        early_stopping_rounds:
          type: categorical
          choices: [20, 30, 40]

  # 3-feat: T_THMs→[32,16]+Tanh+wd=0.05; DBCM→[32,32,32]+SiLU+wd=1e-5;
  # BDCM→[32]+Tanh+wd=1e-5. Keep same candidates; 4 features may shift preferences.
  - name: mlp
    alias: mlp
    params:
      hidden_dims: [32]
      dropout: 0.35
      activation: Tanh
    tuning:
      trials: 30
    search_space:
      model:
        hidden_dims:
          type: categorical
          choices: ["16", "32", "16-8", "32-16", "32-32", "32-32-32"]
          value_map:
            "16": [16]
            "32": [32]
            "16-8": [16, 8]
            "32-16": [32, 16]
            "32-32": [32, 32]
            "32-32-32": [32, 32, 32]
        dropout:
          type: float
          low: 0.15
          high: 0.5
          step: 0.05
        activation:
          type: categorical
          choices: [SiLU, LeakyReLU, Tanh]
      training:
        lr:
          type: float
          low: 0.002
          high: 0.02
          log: true
        weight_decay:
          type: categorical
          choices: [0.000001, 0.00001, 0.0001, 0.001, 0.01, 0.02, 0.05]
        batch_size:
          type: categorical
          choices: [8, 16, 32]
        optimizer: null
        loss:
          type: categorical
          choices: [MSE, Huber]
        huber_delta:
          type: categorical
          choices: [0.5, 1.0]

  # grid=3, k=5 confirmed across all prior experiments. Fixed.
  - name: kan
    alias: kan
    params:
      hidden_dims: [16]
      grid: 3
      k: 5
      base_fun: silu
    tuning:
      trials: 25
    search_space:
      model:
        hidden_dims:
          type: categorical
          choices: ["16", "24-12", "16-8", "32"]
          value_map:
            "16": [16]
            "24-12": [24, 12]
            "16-8": [16, 8]
            "32": [32]
        grid: null
        k: null
      training:
        lr:
          type: float
          low: 0.002
          high: 0.01
          log: true
        weight_decay:
          type: float
          low: 0.0000001
          high: 0.005
          log: true
        batch_size:
          type: categorical
          choices: [8, 16, 32]
        optimizer:
          type: categorical
          choices: [Adam, AdamW]

training:
  seed: 42
  max_epochs: 500
  patience: 50
  batch_size: 16
  lr: 0.001
  weight_decay: 0.0001
  val_fraction: 0.15
  optimizer: Adam
  loss: MSE

tuning:
  enabled: true
  scout: true
  folds: 3
  stability_penalty: 0.15

outputs:
  dir: ../checkpoints/ablation_4feat
  save_models: false
  save_predictions: false
