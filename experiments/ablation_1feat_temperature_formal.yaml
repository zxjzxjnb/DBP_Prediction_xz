# Ablation Formal Tuning: Temperature only (1 feature)
#
# Refined from the temperature-only scout run:
#   checkpoints/ablation_1feat_temperature/20260319T130715Z
#
# Key scout findings applied:
#   - RF: max_depth=2 dominated all targets; bootstrap=true stable; min_samples_leaf=5-6
#   - XGB: very shallow trees dominate (max_depth=1-2); DBCM prefers high min_child_weight
#   - MLP: T_THMs→Tanh+[8]; DBCM→LeakyReLU+[16,8]; BDCM→linear/8 with strong weight_decay
#   - KAN: grid=3 confirmed; k=5 stable; DBCM→[24,12], BDCM→[16], T_THMs prefers AdamW
#
# Run:
#   dbp run experiments/ablation_1feat_temperature_formal.yaml

dataset:
  path: ../data/DBP_dataset_DWTP_B.csv
  format: csv
  features:
    - temp_C
  targets:
    - T_THMs_ug_L
    - DBCM_ug_L
    - BDCM_ug_L
  split:
    strategy: predefined
    column: split
    train_label: train
    test_label: test

task:
  strategy: per_target

features:
  steps: []

models:
  # Scout strongly converged to depth-2 forests with bootstrap and larger leaf sizes.
  - name: random_forest
    alias: rf
    params:
      n_estimators: 350
      max_depth: 2
      min_samples_split: 6
      min_samples_leaf: 5
      max_features: log2
      bootstrap: true
      max_samples: 0.9
    tuning:
      trials: 45
    search_space:
      model:
        n_estimators:
          type: int
          low: 200
          high: 400
          step: 50
        max_depth:
          type: categorical
          choices: [2, 4]
        min_samples_split:
          type: int
          low: 4
          high: 10
        min_samples_leaf:
          type: int
          low: 4
          high: 6
        max_features:
          type: categorical
          choices: [1.0, log2]
        bootstrap:
          type: categorical
          choices: [true]
        max_samples:
          type: float
          low: 0.8
          high: 1.0
          step: 0.1
          when:
            bootstrap: true
          default: null
      study:
        n_startup_trials: 10
        n_warmup_steps: 1

  # Scout kept XGB extremely shallow; formal search stays near max_depth=1-2.
  - name: xgboost
    alias: xgb
    params:
      n_estimators: 250
      max_depth: 1
      learning_rate: 0.18
      min_child_weight: 5.0
      subsample: 0.7
      colsample_bytree: 1.0
      reg_alpha: 0.001
      reg_lambda: 0.3
      gamma: 0.01
      early_stopping_rounds: 30
      tree_method: hist
    tuning:
      trials: 55
    search_space:
      model:
        n_estimators:
          type: int
          low: 150
          high: 400
          step: 50
        max_depth:
          type: int
          low: 1
          high: 3
        learning_rate:
          type: float
          low: 0.08
          high: 0.3
          log: true
        min_child_weight:
          type: float
          low: 2.0
          high: 9.0
        subsample:
          type: float
          low: 0.6
          high: 0.8
          step: 0.1
        colsample_bytree:
          type: categorical
          choices: [0.8, 1.0]
        gamma:
          type: float
          low: 0.0001
          high: 0.5
          log: true
        reg_alpha:
          type: float
          low: 0.000001
          high: 0.05
          log: true
        reg_lambda:
          type: float
          low: 0.001
          high: 5.0
          log: true
        early_stopping_rounds:
          type: categorical
          choices: [20, 30, 40]
      study:
        n_startup_trials: 12
        n_warmup_steps: 1

  # Scout exposed clear per-target MLP structure: tiny Tanh net for T_THMs,
  # 16-8 + LeakyReLU for DBCM, and near-linear strong-regularization fits for BDCM.
  - name: mlp
    alias: mlp
    params:
      hidden_dims: [8]
      dropout: 0.15
      activation: Tanh
    tuning:
      trials: 50
    search_space:
      model:
        hidden_dims:
          type: categorical
          choices: ["linear", "8", "16-8"]
          value_map:
            "linear": []
            "8": [8]
            "16-8": [16, 8]
        dropout:
          type: float
          low: 0.05
          high: 0.35
          step: 0.05
        activation:
          type: categorical
          choices: [LeakyReLU, Tanh]
      training:
        lr:
          type: float
          low: 0.003
          high: 0.02
          log: true
        weight_decay:
          type: categorical
          choices: [0.000001, 0.00001, 0.0001, 0.001, 0.01, 0.05]
        batch_size:
          type: categorical
          choices: [8, 16]
        optimizer: null
        loss:
          type: categorical
          choices: [MSE, Huber]
        huber_delta:
          type: categorical
          choices: [0.5, 1.0]
      study:
        n_startup_trials: 12
        n_warmup_steps: 2

  # Scout strongly favored grid=3 and mostly k=5; keep both compact.
  - name: kan
    alias: kan
    params:
      hidden_dims: [16]
      grid: 3
      k: 5
      base_fun: silu
    tuning:
      trials: 40
    search_space:
      model:
        hidden_dims:
          type: categorical
          choices: ["8", "16", "24-12"]
          value_map:
            "8": [8]
            "16": [16]
            "24-12": [24, 12]
        grid: null
        k:
          type: categorical
          choices: [5]
      training:
        lr:
          type: float
          low: 0.003
          high: 0.01
          log: true
        weight_decay:
          type: float
          low: 0.0000001
          high: 0.005
          log: true
        batch_size:
          type: categorical
          choices: [8, 32]
        optimizer:
          type: categorical
          choices: [Adam, AdamW]
      study:
        n_startup_trials: 10
        n_warmup_steps: 2

training:
  seed: 42
  max_epochs: 1200
  patience: 100
  batch_size: 16
  lr: 0.001
  weight_decay: 0.0001
  val_fraction: 0.15
  optimizer: Adam
  loss: MSE

tuning:
  enabled: true
  scout: false
  folds: 5
  stability_penalty: 0.18

outputs:
  dir: ../checkpoints/ablation_1feat_temperature_formal
  save_models: true
  save_predictions: true
