[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dbp-prediction"
version = "0.1.0"
description = "Predicting disinfection by-products (DBPs) in drinking water with reproducible tabular ML experiments"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "Xiaojie Zou"},
]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "pyarrow>=17.0",
    "scikit-learn>=1.5",
    "torch>=2.0",
    "optuna>=4.0",
    "pykan>=0.2",
    "xgboost>=2.1",
    "PyYAML>=6.0",
    "matplotlib>=3.9",
    "tqdm>=4.60",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "pre-commit>=3.0",
]
ui = [
    "streamlit>=1.40",
]
analysis = [
    "shap>=0.45",
]

[project.scripts]
dbp = "dbp_prediction.cli.main:main"
dbp-train-mlp = "dbp_prediction.cli.train_mlp:main"
dbp-train-kan = "dbp_prediction.cli.train_kan:main"
dbp-tune-mlp = "dbp_prediction.cli.tune_mlp:main"
dbp-tune-kan-pt = "dbp_prediction.cli.tune_kan_per_target:main"
dbp-report = "dbp_prediction.cli.generate_report:main"
dbp-ui = "dbp_prediction.ui.launch:main"

[tool.setuptools.packages.find]
include = ["dbp_prediction*"]

[tool.setuptools.package-data]
dbp_prediction = ["_data/*.csv"]

# ── Ruff (linter + formatter) ──────────────────────────────────────────────

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]
ignore = ["E501"]  # line-length handled by formatter

[tool.ruff.lint.isort]
known-first-party = ["dbp_prediction"]

# ── Pytest ─────────────────────────────────────────────────────────────────

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
